name: Refresh restaurant deals

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-restaurant-deals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh and validate restaurant deals
        run: |
          set -o pipefail
          npm run refresh-data 2>&1 | tee refresh-data.log
      - name: Commit changed data
        run: |
          if git diff --quiet -- public/data/deals.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/deals.json
          git commit -m "data: refresh restaurant deals"
          git fetch origin main
          git rebase origin/main
          git push
      - name: Notify Leandro about skipped coordinates
        if: success() && hashFiles('refresh-warnings.log') != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILURE_LOG: refresh-warnings.log
          NOTIFICATION_KIND: warning
        run: .github/scripts/notify-telegram.sh
      - name: Notify Leandro on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILURE_LOG: refresh-data.log
        run: .github/scripts/notify-telegram.sh
